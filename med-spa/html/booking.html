<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a Consultation | Glow Med Spa</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="app.css"><script defer src="app.js"></script></head>
<body class="bg-[#fff8f8]"><header class="border-b border-[#efdfe2] bg-white"><div class="container-page flex min-h-[76px] items-center justify-between"><a href="index.html" class="serif text-2xl font-bold tracking-[.16em]">GLOW<span class="text-[#e84d72]">.</span></a><a class="nav-link" href="index.html">Back to Home</a></div></header><main class="container-page grid min-h-[760px] items-center gap-12 py-16 lg:grid-cols-[1fr_.9fr]"><section><p class="section-kicker">Book a Consultation</p><h1 class="mt-4 text-5xl font-semibold">Start your beauty journey</h1><p class="mt-5 max-w-lg leading-8 text-[#786c70]">Tell us a little about yourself and one of our patient coordinators will contact you to confirm your appointment.</p><form class="soft-card mt-9 grid gap-4 p-7 sm:grid-cols-2"><label class="text-xs font-bold">Full Name<input class="field mt-2" type="text" placeholder="Your name"></label><label class="text-xs font-bold">Phone Number<input class="field mt-2" type="tel" placeholder="(212) 555-0000"></label><label class="text-xs font-bold">Email Address<input class="field mt-2" type="email" placeholder="you@example.com"></label><label class="text-xs font-bold">Preferred Date<input class="field mt-2" type="date"></label><label class="text-xs font-bold">Treatment Interest<select class="field mt-2"><option>Select a treatment</option><option>Botox</option><option>Dermal Fillers</option><option>HydraFacial</option><option>Laser Treatment</option></select></label><label class="text-xs font-bold">Preferred Time<select class="field mt-2"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label><label class="text-xs font-bold sm:col-span-2">Additional Message<textarea class="field mt-2 min-h-28" placeholder="How can we help?"></textarea></label><button class="btn-primary sm:col-span-2" type="submit">Request Appointment</button></form></section><section class="relative hidden lg:block"><div class="absolute -inset-6 rounded-full bg-[#f7d7dc]"></div><img class="relative h-[650px] w-full rounded-[50%_50%_12px_12px] object-cover" src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=90" alt="Relaxed spa client"></section></main><footer class="bg-[#211a1c] py-7 text-center text-xs text-white/50">&copy; <span data-year></span> Glow Med Spa</footer></body></html>
