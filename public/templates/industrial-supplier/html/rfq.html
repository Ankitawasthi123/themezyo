<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a Quote | InduStrive</title><link rel="stylesheet" href="app.css"><script src="https://unpkg.com/lucide@latest"></script></head><body><div data-header></div><main><section class="page-hero"><div class="container"><div class="crumbs">Home / Request a Quote</div><h1 class="page-title">Request for Quote (RFQ)</h1><p class="page-sub">Share your requirements and our engineering team will prepare the best technical and commercial proposal.</p></div></section><section class="section section-soft"><div class="container panel"><div class="steps"><span class="active">1. Requirements</span><span>2. Company Details</span><span>3. Review & Submit</span></div><form class="rfq-form" data-demo-form><div class="field"><label>Product Category *</label><select required><option value="">Select Category</option><option>Hydraulic Systems</option><option>Industrial Valves</option><option>Motors & Drives</option></select></div><div class="field"><label>Product Name / Part No.</label><input placeholder="Enter product name or part number"></div><div class="field"><label>Quantity *</label><input type="number" min="1" required placeholder="Enter quantity"></div><div class="field"><label>Unit *</label><select required><option>Pieces</option><option>Sets</option><option>Units</option></select></div><div class="field wide"><label>Application / Usage</label><textarea rows="4" placeholder="Describe your application"></textarea></div><div class="field wide"><label>Specifications / Requirements</label><textarea rows="4" placeholder="Add technical requirements"></textarea></div><div class="field"><label>Your Name *</label><input required></div><div class="field"><label>Business Email *</label><input type="email" required></div><div class="wide"><button class="button button-blue" type="submit">Submit RFQ</button></div></form></div></section></main><div data-footer></div><div class="toast" data-toast></div><script src="app.js"></script></body></html>
