<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu - CloudCrave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="menu.html">
  <header class="cc-header" data-cc-header></header>
  <main>
    <section class="cc-page-hero">
      <div class="cc-container">
        <span class="cc-kicker">Explore our dishes</span>
        <h1 class="cc-page-title">Our Menu</h1>
        <p class="cc-lead">Delicious meals, snacks, desserts and beverages prepared fresh in our cloud kitchen.</p>
        <div class="cc-choice-wrap mt-6">
          <button class="cc-chip active" data-menu-filter="all">All</button>
          <button class="cc-chip" data-menu-filter="bestsellers">Bestsellers</button>
          <button class="cc-chip" data-menu-filter="north">North Indian</button>
          <button class="cc-chip" data-menu-filter="biryani">Biryani's</button>
          <button class="cc-chip" data-menu-filter="chinese">Chinese</button>
          <button class="cc-chip" data-menu-filter="pasta">Pasta</button>
          <button class="cc-chip" data-menu-filter="healthy">Healthy Meals</button>
          <button class="cc-chip" data-menu-filter="desserts">Desserts</button>
          <button class="cc-chip" data-menu-filter="beverages">Beverages</button>
        </div>
      </div>
    </section>
    <section class="cc-section pt-3">
      <div class="cc-container">
        <div class="cc-menu-grid" data-menu-grid></div>
      </div>
    </section>
    <section class="cc-section pt-0">
      <div class="cc-container">
        <div class="cc-card cc-band-inner cc-band">
          <div><h2 class="text-3xl font-black">Looking for something in bulk?</h2><p class="text-white/80">Get special discounts on large orders and parties.</p></div>
          <a class="cc-btn dark" href="catering.html">Order Catering</a>
        </div>
      </div>
    </section>
  </main>
  <footer class="cc-footer" data-cc-footer></footer>
  <script src="app.js"></script>
</body>
</html>
