<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - CloudCrave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="contact.html">
  <header class="cc-header" data-cc-header></header>
  <main>
    <section class="cc-page-hero">
      <div class="cc-container">
        <span class="cc-kicker">We are here to help</span>
        <h1 class="cc-page-title">Contact Us</h1>
        <p class="cc-lead">Questions about orders, catering, delivery zones or franchise plans? Send a message.</p>
      </div>
    </section>
    <section class="cc-section pt-0">
      <div class="cc-container cc-grid-2">
        <div>
          <div class="cc-grid-2">
            <div class="cc-card cc-form-panel"><span class="cc-icon" data-icon="phone"></span><h3 class="font-black text-xl mt-3">Call Us</h3><p class="text-stone-600">+91 98765 43210</p></div>
            <div class="cc-card cc-form-panel"><span class="cc-icon" data-icon="mail"></span><h3 class="font-black text-xl mt-3">Email Us</h3><p class="text-stone-600">info@cloudcrave.com</p></div>
          </div>
          <div class="cc-card cc-map mt-6"><div class="cc-zone"></div><div class="cc-pin p2"></div><div class="cc-route" data-icon="pin"></div></div>
        </div>
        <form class="cc-card cc-form-panel" data-form-message>
          <h2 class="text-3xl font-black mb-5">Send us a Message</h2>
          <input class="cc-field" placeholder="Full Name">
          <input class="cc-field mt-3" placeholder="Email Address">
          <input class="cc-field mt-3" placeholder="Phone Number">
          <textarea class="cc-field mt-3" placeholder="Your Message"></textarea>
          <button class="cc-btn mt-4">Send Message</button>
          <p class="text-sm cc-red font-bold mt-3" data-status></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="cc-footer" data-cc-footer></footer>
  <script src="app.js"></script>
</body>
</html>
