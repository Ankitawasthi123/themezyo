<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart - CloudCrave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="cart.html">
  <header class="cc-header" data-cc-header></header>
  <main>
    <section class="cc-page-hero">
      <div class="cc-container cc-grid-2">
        <div class="cc-card cc-form-panel">
          <span class="cc-kicker">Your order</span>
          <h1 class="cc-page-title">Cart Summary</h1>
          <p class="cc-lead">This demo cart keeps the order count from your Add buttons. Connect it with a real checkout when you customize the template.</p>
          <a class="cc-btn mt-6" href="menu.html">Continue Ordering</a>
        </div>
        <form class="cc-card cc-form-panel" data-form-message>
          <h2 class="text-3xl font-black mb-5">Delivery Details</h2>
          <input class="cc-field" placeholder="Full name">
          <input class="cc-field mt-3" placeholder="Phone number">
          <input class="cc-field mt-3" placeholder="Address">
          <button class="cc-btn mt-4">Place Demo Order</button>
          <p class="text-sm cc-red font-bold mt-3" data-status></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="cc-footer" data-cc-footer></footer>
  <script src="app.js"></script>
</body>
</html>
