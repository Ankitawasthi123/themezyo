  </g>
  <text x="174" y="416" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="900">Prompt builder</text>
  <rect x="174" y="454" width="402" height="54" rx="17" fill="#f8fbff" stroke="#dce8f5"/>
  <text x="202" y="489" fill="#8a97a8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Sunset city, cinematic, creator brand</text>
  <rect x="174" y="534" width="402" height="128" rx="20" fill="#f8fbff" stroke="#dce8f5"/>
  <text x="202" y="575" fill="#536274" font-family="Arial, sans-serif" font-size="18" font-weight="800">Create a vibrant social post with</text>
  <text x="202" y="605" fill="#536274" font-family="Arial, sans-serif" font-size="18" font-weight="800">a short caption and 5 hashtags.</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="900">
    <rect x="174" y="696" width="108" height="38" rx="14" fill="#eaf4ff"/>
