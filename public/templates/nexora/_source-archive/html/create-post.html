<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Post - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="nexora.css" />
</head>
<body>
  <div class="app-shell layout">
    <aside class="hidden lg:block">
      <a href="index.html" class="flex items-center gap-3 text-xl font-black"><span class="brand-mark">N</span>Nexora</a>
      <nav class="mt-8 space-y-2"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="explore.html">Explore</a><a class="nav-link active" href="create-post.html">Create Post</a><a class="nav-link" href="shorts.html">Shorts</a><a class="nav-link" href="messages.html">Messages</a><a class="nav-link" href="notifications.html">Notifications</a><a class="nav-link" href="profile.html">Profile</a><a class="nav-link" href="settings.html">Settings</a></nav>
    </aside>
    <main>
      <header class="flex items-center justify-between gap-4"><div><h1 class="text-3xl font-black">Create Post</h1><p class="mt-1 text-sm muted">Compose a polished post and attach media.</p></div><a class="btn-secondary px-5 py-3" href="index.html">Cancel</a></header>
      <section class="panel mt-8 p-6">
        <div class="flex gap-4"><img class="avatar h-14 w-14" src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=96&q=80" alt="Arjun" /><textarea class="field min-h-36 resize-none" placeholder="Share an update with your network..."></textarea></div>
        <div class="mt-5 grid gap-3 sm:grid-cols-4"><button class="btn-secondary py-3">Photo</button><button class="btn-secondary py-3">Video</button><button class="btn-secondary py-3">Short</button><button class="btn-secondary py-3">Feeling</button></div>
        <div class="mt-6 grid gap-4 sm:grid-cols-4"><img class="h-40 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=400&q=90" alt="Attachment" /><img class="h-40 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=400&q=90" alt="Attachment" /><img class="h-40 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1622979135225-d2ba269cf1ac?auto=format&fit=crop&w=400&q=90" alt="Attachment" /><div class="grid h-40 place-items-center rounded-2xl border border-dashed border-slate-300 text-sm font-bold muted">Add media</div></div>
        <div class="mt-7 flex justify-end"><a class="btn-primary px-8 py-4" href="index.html">Publish Post</a></div>
      </section>
    </main>
  </div>
</body>
</html>
