<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="nexora.css" />
</head>
<body>
  <main class="grid min-h-screen lg:grid-cols-[.95fr_1.05fr]">
    <section class="hidden place-items-center bg-violet/5 p-10 lg:grid"><div class="max-w-sm"><a href="index.html" class="flex items-center gap-3 text-2xl font-black"><span class="brand-mark">N</span>Nexora</a><h1 class="mt-10 text-4xl font-black leading-tight">Start building your creative network.</h1><p class="mt-4 leading-7 muted">Join a modern community for visual storytelling and AI-enhanced content.</p></div></section>
    <section class="grid place-items-center p-6">
      <form class="panel w-full max-w-md p-8">
        <h2 class="text-2xl font-black">Create your account</h2><p class="mt-2 text-sm muted">Set up your profile in less than a minute.</p>
        <label class="mt-7 block text-sm font-bold">Full name<input class="field mt-2" /></label>
        <label class="mt-4 block text-sm font-bold">Username<input class="field mt-2" /></label>
        <label class="mt-4 block text-sm font-bold">Email address<input class="field mt-2" type="email" /></label>
        <label class="mt-4 block text-sm font-bold">Password<input class="field mt-2" type="password" /></label>
        <label class="mt-5 flex items-start gap-3 text-sm muted"><input class="mt-1" type="checkbox" />I agree to the Terms and Privacy Policy.</label>
        <a href="index.html" class="btn-primary mt-7 w-full py-4">Create Account</a>
        <p class="mt-7 text-center text-sm muted">Already have an account? <a class="font-black text-violet" href="login.html">Log in</a></p>
      </form>
    </section>
  </main>
</body>
</html>
