<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="nexora.css" />
</head>
<body>
  <main class="grid min-h-screen lg:grid-cols-[.95fr_1.05fr]">
    <section class="hidden place-items-center bg-violet/5 p-10 lg:grid">
      <div class="max-w-sm"><a href="index.html" class="flex items-center gap-3 text-2xl font-black"><span class="brand-mark">N</span>Nexora</a><h1 class="mt-10 text-4xl font-black leading-tight">Create, connect, and grow your audience.</h1><p class="mt-4 leading-7 muted">A polished social workspace for creators, communities, and AI-assisted content.</p></div>
    </section>
    <section class="grid place-items-center p-6">
      <form class="panel w-full max-w-md p-8">
        <h2 class="text-2xl font-black">Welcome back</h2><p class="mt-2 text-sm muted">Sign in to continue to Nexora.</p>
        <label class="mt-8 block text-sm font-bold">Email or username<input class="field mt-2" type="email" /></label>
        <label class="mt-4 block text-sm font-bold">Password<input class="field mt-2" type="password" /></label>
        <div class="mt-4 flex items-center justify-between text-sm"><label class="flex items-center gap-2 muted"><input type="checkbox" />Remember me</label><a class="font-bold text-violet" href="#">Forgot password?</a></div>
        <a href="index.html" class="btn-primary mt-7 w-full py-4">Log In</a>
        <p class="mt-7 text-center text-sm muted">New to Nexora? <a class="font-black text-violet" href="signup.html">Create an account</a></p>
      </form>
    </section>
  </main>
</body>
</html>
