<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="nexora.css" />
</head>
<body>
  <div class="app-shell grid gap-6 lg:grid-cols-[340px_1fr]">
    <aside class="panel p-5">
      <div class="flex items-center justify-between"><a href="index.html" class="flex items-center gap-3 text-xl font-black"><span class="brand-mark">N</span>Nexora</a><a class="text-sm font-black text-violet" href="index.html">Home</a></div>
      <input class="field mt-6" placeholder="Search conversations" />
      <div class="mt-5 space-y-2">
        <button class="w-full rounded-2xl bg-violet/10 p-4 text-left"><b>Emma Watson</b><p class="text-sm muted">Can you review the concept?</p></button>
        <button class="w-full rounded-2xl p-4 text-left hover:bg-slate-50"><b>Liam Carter</b><p class="text-sm muted">The campaign board looks great.</p></button>
        <button class="w-full rounded-2xl p-4 text-left hover:bg-slate-50"><b>Olivia Rhye</b><p class="text-sm muted">Thanks for the feedback.</p></button>
        <button class="w-full rounded-2xl p-4 text-left hover:bg-slate-50"><b>Noah Smith</b><p class="text-sm muted">Let's sync tomorrow.</p></button>
      </div>
    </aside>
    <main class="panel flex min-h-[760px] flex-col p-6">
      <header class="flex items-center gap-4 border-b border-slate-100 pb-5"><img class="avatar h-12 w-12" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=96&q=80" alt="Emma" /><div><h1 class="font-black">Emma Watson</h1><p class="text-sm muted">Active now</p></div></header>
      <div class="flex-1 space-y-5 py-6"><p class="max-w-md rounded-2xl bg-slate-100 p-4">Hey Arjun, the sunset post is performing really well.</p><p class="max-w-md rounded-2xl bg-slate-100 p-4">Can you review this concept for tomorrow?</p><p class="ml-auto max-w-md rounded-2xl bg-violet p-4 text-white">Absolutely. Send it over and I will take a look.</p><div class="ml-auto max-w-md rounded-2xl bg-violet p-3 text-white"><img class="rounded-xl" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=420&q=90" alt="Shared creative" /><p class="mt-3">This direction feels polished.</p></div></div>
      <form class="flex gap-3"><input class="field" placeholder="Type a message" /><button class="btn-primary px-6">Send</button></form>
    </main>
  </div>
</body>
</html>
