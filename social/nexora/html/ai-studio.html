<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="nexora.css" />
</head>
<body>
  <div class="app-shell layout">
    <aside class="hidden lg:block">
      <a href="index.html" class="flex items-center gap-3 text-xl font-black"><span class="brand-mark">N</span>Nexora</a>
      <nav class="mt-8 space-y-2"><a class="nav-link" href="index.html">Home</a><a class="nav-link active" href="ai-studio.html">AI Studio</a><a class="nav-link" href="create-post.html">Create Post</a><a class="nav-link" href="explore.html">Explore</a><a class="nav-link" href="settings.html">Settings</a></nav>
    </aside>
    <main>
      <header><h1 class="text-3xl font-black">AI Studio</h1><p class="mt-1 text-sm muted">Generate images, captions, avatars, and edits for social content.</p></header>
      <section class="mt-8 grid gap-6 xl:grid-cols-[260px_1fr]">
        <aside class="panel p-4"><button class="nav-link active w-full">AI Image</button><button class="nav-link w-full">AI Video</button><button class="nav-link w-full">AI Caption</button><button class="nav-link w-full">AI Avatar</button><button class="nav-link w-full">AI Edit</button></aside>
        <div class="panel p-6">
          <label class="text-sm font-black">Prompt<textarea class="field mt-2 min-h-36 resize-none" placeholder="A cinematic mountain lake at sunrise, clean editorial lighting, premium social campaign style"></textarea></label>
          <div class="mt-5 grid gap-4 sm:grid-cols-4"><img class="h-40 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=400&q=90" alt="AI concept" /><img class="h-40 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=400&q=90" alt="AI concept" /><img class="h-40 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1622979135225-d2ba269cf1ac?auto=format&fit=crop&w=400&q=90" alt="AI concept" /><img class="h-40 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=400&q=90" alt="AI concept" /></div>
          <div class="mt-6 grid gap-3 sm:grid-cols-4"><button class="chip active">1:1</button><button class="chip">9:16</button><button class="chip">16:9</button><button class="chip">4:5</button></div>
          <button class="btn-primary mt-7 w-full py-4">Generate Assets</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
