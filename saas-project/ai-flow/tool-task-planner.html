<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Task Planner - AIFlow</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{violet:'#6338f4',ink:'#0f1533'},boxShadow:{soft:'0 18px 50px rgba(42,34,102,.10)'}}}}</script><style>body{font-family:Inter,ui-sans-serif,system-ui;color:#0f1533}</style></head>
<body><header class="border-b border-slate-100"><nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4"><a href="index.html" class="flex items-center gap-3 text-lg font-extrabold"><span class="grid h-9 w-9 place-items-center rounded-full bg-violet text-white">*</span>AIFlow</a><a href="ai-tools.html" class="rounded-md border border-violet px-5 py-3 text-sm font-bold text-violet">Back to Tools</a></nav></header><main class="mx-auto max-w-7xl px-6 py-12"><p class="text-sm font-extrabold uppercase text-violet">AI Tool</p><h1 class="mt-3 text-4xl font-extrabold">AI Task Planner</h1><p class="mt-4 max-w-2xl text-slate-600">Turn goals into prioritized plans and action lists.</p><section class="mt-10 grid gap-6 lg:grid-cols-2"><form class="rounded-lg border border-slate-100 p-6 shadow-soft"><label class="text-sm font-bold">Goal</label><textarea class="mt-2 h-48 w-full rounded-md border border-slate-200 px-4 py-3" placeholder="Launch a new landing page this week"></textarea><button class="mt-6 w-full rounded-md bg-violet py-3 font-bold text-white" type="button">Create Plan</button></form><div class="rounded-lg border border-slate-100 bg-slate-50 p-6 shadow-soft"><h2 class="font-extrabold">Suggested Plan</h2><ol class="mt-5 space-y-4 text-slate-700"><li>1. Define goal and deliverables.</li><li>2. Break work into milestones.</li><li>3. Assign priorities and deadlines.</li><li>4. Track completion and blockers.</li></ol></div></section></main></body>
